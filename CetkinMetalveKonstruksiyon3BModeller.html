<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3B Yapılar - Çetkin Metal</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0f1115;
            background-image: radial-gradient(circle at 50% 50%, #1a1f2c 0%, #0f1115 100%);
            margin: 0;
            padding: 30px 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1250px;
            width: 100%;
        }
        .item-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }
        .item-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }
        .viewer-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            border-radius: 12px;
            margin-bottom: 15px;
            background-color: #e5e7eb;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
        .no-model-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1f2937;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 12px;
        }
        .no-model-message span {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .button {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .button a {
            color: #f3f4f6;
            text-decoration: none;
            font-weight: 500;
            display: block;
            width: 100%;
            height: 100%;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        /* Mobil Cihazlar İçin Optimizasyon */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .item-card {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_1" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_1"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html">Raylı Kapılar - 1</a></button>
        </div>
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_2" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_2"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html?id=v2_model_2">Raylı Kapılar - 2</a></button>
        </div>
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_3" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_3"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html?id=v2_model_3">Raylı Kapılar - 3</a></button>
        </div>
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_4" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_4"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html?id=v2_model_4">Raylı Kapılar - 4</a></button>
        </div>
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_5" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_5"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html?id=v2_model_5">Raylı Kapılar - 5</a></button>
        </div>
        <div class="item-card">
            <div class="viewer-container">
                <model-viewer id="viewer_6" camera-controls auto-rotate shadow-intensity="2"></model-viewer>
                <div class="no-model-message" id="msg_6"><span>📦</span>Henüz model eklenmedi</div>
            </div>
            <button class="button"><a href="CetkinMetalveKonstruksiyon3bgörünüm.html?id=v2_model_6">Raylı Kapılar - 6</a></button>
        </div>
    </div>

   <script>
        for (let i = 1; i <= 6; i++) {
            const storageKey = 'v2_model_' + i;
            const modelData = localStorage.getItem(storageKey);
            const viewer = document.getElementById('viewer_' + i);
            const message = document.getElementById('msg_' + i);

            if (modelData) {
                viewer.src = modelData;
                message.style.display = 'none';
            } else {
                message.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
