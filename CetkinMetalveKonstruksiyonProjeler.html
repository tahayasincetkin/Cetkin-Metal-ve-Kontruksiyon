<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çetkin Metal Satıcı Paneli - Gelen Projeler</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: #090d16;
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 15px 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .header-container {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }
            .header-actions {
                flex-direction: column;
                width: 100%;
            }
            .header-actions button {
                width: 100%;
                margin-right: 0 !important;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h2 style="color: #ffffff; margin: 0; font-size: 18px;">Çetkin Metal Satıcı Paneli</h2>

        <div class="header-actions">
            <button onclick="openProjectsModal()" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; margin-right: 15px; font-family: 'Segoe UI', sans-serif;">
                📁 Gelen Projeler <span id="projectBadge" style="background: #0284c7; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px;">0</span>
            </button>

            <button onclick="alert('Modeller sayfasına yönlendiriliyorsunuz...')" style="background: #3b82f6; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: 'Segoe UI', sans-serif;">
                Modeller Sayfasına Git &rarr;
            </button>
        </div>
    </div>

    <div id="projectsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; backdrop-filter: blur(5px); padding: 10px; box-sizing: border-box;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; max-width: 800px; max-height: 90vh; background: #0f172a; border: 1px solid #334155; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; overflow: hidden; color: #f8fafc; box-sizing: border-box;">

            <div style="padding: 20px 24px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;">
                <h3 style="margin: 0; font-size: 18px; color: #f8fafc; display: flex; align-items: center; gap: 10px;">
                    🏗️ Müşteri Proje İstekleri ve İletişim Yönetimi
                </h3>
                <button onclick="closeProjectsModal()" style="background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; padding: 0 5px;">&times;</button>
            </div>

            <div style="padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; box-sizing: border-box;" id="projectListContainer">
                <!-- Projeler buraya dinamik yüklenecek -->
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            loadProjectsToPanel();
        });

        function openProjectsModal() {
            document.getElementById('projectsModal').style.display = 'block';
            loadProjectsToPanel();
        }

        function closeProjectsModal() {
            document.getElementById('projectsModal').style.display = 'none';
        }

        function loadProjectsToPanel() {
            const container = document.getElementById('projectListContainer');
            container.innerHTML = '';

            let savedProjects = JSON.parse(localStorage.getItem('cetkinMetalProjects')) || [];

            if (savedProjects.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #94a3b8; padding: 30px; font-size: 14px;">
                        Henüz gelen yeni bir proje isteği bulunmuyor.
                    </div>
                `;
            } else {
                savedProjects.forEach(proj => {
                    const projectDiv = document.createElement('div');
                    projectDiv.id = `project-item-${proj.id}`;
                    projectDiv.style.cssText = "background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; transition: all 0.3s; box-sizing: border-box;";

                    let cleanPhone = proj.phone ? proj.phone.replace(/\D/g, '') : '';
                    if (cleanPhone.startsWith('0')) {
                        cleanPhone = '9' + cleanPhone;
                    }

                    const whatsappMsg = encodeURIComponent(`Merhaba ${proj.name}, Çetkin Metal'den yazıyoruz. ${proj.type || 'Projeniz'} hakkında görüşmek istiyoruz.`);
                    const whatsappLink = `https://wa.me/${cleanPhone}?text=${whatsappMsg}`;

                    projectDiv.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                            <div style="word-break: break-all; max-width: 100%;">
                                <span style="font-size: 12px; color: #38bdf8; font-weight: 600; text-transform: uppercase;">${proj.type}</span>
                                <h4 style="margin: 4px 0 0 0; font-size: 16px; color: #ffffff;">${proj.name} <span style="font-size: 13px; color: #94a3b8; font-weight: normal; word-break: break-all;">(${proj.phone})</span></h4>
                            </div>
                            <span style="background: #f59e0b20; color: #f59e0b; border: 1px solid #f59e0b40; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap;">${proj.status || 'Yeni Proje'}</span>
                        </div>

                        <p style="font-size: 13px; color: #94a3b8; margin: 0 0 12px 0; background: #0f172a; padding: 10px; border-radius: 6px; word-break: break-word;">
                            <strong>Detay:</strong> ${proj.desc || 'Açıklama girilmedi.'}
                        </p>

                        <!-- Satıcı Not Alanı -->
                        <div style="margin-bottom: 12px;">
                            <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Satıcı Notu:</label>
                            <input type="text" id="note-${proj.id}" value="${proj.note || ''}" placeholder="Müşteri hakkında not ekle..." oninput="saveNote(${proj.id})" style="width: 100%; padding: 8px; background: #090d16; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 13px; box-sizing: border-box; outline: none;">
                        </div>

                        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                            <a href="${whatsappLink}" target="_blank" style="background: #25d366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; flex: 1; justify-content: center; min-width: 140px; box-sizing: border-box;">
                                💬 WhatsApp
                            </a>
                            <button onclick="markAsFinished(${proj.id})" style="background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; flex: 1; min-width: 110px; box-sizing: border-box;">
                                ✓ Tamamlandı
                            </button>
                            <button onclick="deleteProject(${proj.id})" style="background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; min-width: 70px; box-sizing: border-box;">
                                🗑️ Sil
                            </button>
                        </div>
                    `;
                    container.appendChild(projectDiv);
                });
            }

            const badgeElement = document.getElementById('projectBadge');
            if(badgeElement) {
                badgeElement.innerText = savedProjects.length;
            }
        }

        function saveNote(id) {
            const noteInput = document.getElementById(`note-${id}`).value;
            let savedProjects = JSON.parse(localStorage.getItem('cetkinMetalProjects')) || [];
            savedProjects = savedProjects.map(p => {
                if(p.id === id) {
                    p.note = noteInput;
                }
                return p;
            });
            localStorage.setItem('cetkinMetalProjects', JSON.stringify(savedProjects));
        }

        function markAsFinished(id) {
            let savedProjects = JSON.parse(localStorage.getItem('cetkinMetalProjects')) || [];
            savedProjects = savedProjects.map(p => {
                if(p.id === id) {
                    p.status = "Tamamlandı";
                }
                return p;
            });
            localStorage.setItem('cetkinMetalProjects', JSON.stringify(savedProjects));
            loadProjectsToPanel();
        }

        function deleteProject(id) {
            if(confirm("Bu projeyi silmek istediğinize emin misiniz?")) {
                let savedProjects = JSON.parse(localStorage.getItem('cetkinMetalProjects')) || [];
                savedProjects = savedProjects.filter(p => p.id !== id);
                localStorage.setItem('cetkinMetalProjects', JSON.stringify(savedProjects));
                loadProjectsToPanel();
            }
        }
    </script>
</body>
</html>
